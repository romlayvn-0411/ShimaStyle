name: Build ShimaStyle Tweak

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Tự động chạy khi bạn push một tag bắt đầu bằng "v" (ví dụ: v1.0.0)
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép kích hoạt build thủ công từ giao diện GitHub

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    name: Build .deb Package
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tải toàn bộ lịch sử commit để lệnh git log hoạt động chính xác

      - name: Install System Dependencies
        run: brew install ldid xz

      - name: Setup Theos & iOS SDKs
        run: |
          # Tải Theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          # Tải iOS SDKs (giải nén trực tiếp để tiết kiệm thời gian)
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -x -z -C $THEOS/sdks --strip-components=1

      - name: Update Version in Control File
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            FILE="control"
            [ ! -f "control" ] && FILE="control.yaml"
            BASE_VERSION=$(awk '/^Version:/ {print $2}' "$FILE" | sed 's/-.*//')
            VERSION="${BASE_VERSION}"
          fi
          echo "Updating version to $VERSION"
          echo "pkg_version=$VERSION" >> $GITHUB_OUTPUT
          if [ -f "control" ]; then
            sed -i.bak "s/^Version:.*/Version: $VERSION/" control
            rm -f control.bak
          elif [ -f "control.yaml" ]; then
            sed -i.bak "s/^Version:.*/Version: $VERSION/" control.yaml
            rm -f control.yaml.bak
          fi

      - name: Build Tweak (Make Package)
        run: |
          export THEOS_PACKAGE_SCHEME=rootless
          make package FINALPACKAGE=1 2>&1 | tee build.log
          # Verify build output exists
          if [ $(find packages -name "*.deb" -type f 2>/dev/null | wc -l) -gt 0 ]; then
            echo "✓ Build successful - $(ls -1 packages/*.deb | wc -l) .deb file(s) generated:"
            ls -lh packages/*.deb
          else
            echo "❌ Build failed - No .deb files found"
            echo "Build log:"
            cat build.log | tail -100
            exit 1
          fi

      - name: Generate Release Notes
        id: release_notes
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "### 📝 Danh sách thay đổi:" >> $GITHUB_OUTPUT
          # Lấy danh sách tối đa 3 commit gần nhất kèm tên người code
          git log -3 --pretty=format:"- %h: %s (%an)" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShimaStyle-${{ steps.version.outputs.pkg_version }}-build
          path: packages/
          retention-days: 30

      - name: Delete Existing Release (Tránh trùng lặp Tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release delete v${{ steps.version.outputs.pkg_version }} --cleanup-tag -y || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.pkg_version }}
          name: Release v${{ steps.version.outputs.pkg_version }}
          body: ${{ steps.release_notes.outputs.body }}
          files: packages/*.deb
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Older Releases (Giữ 2 bản mới nhất)
        if: startsWith(github.ref, 'refs/tags/')
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 2
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}