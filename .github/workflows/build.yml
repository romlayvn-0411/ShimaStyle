name: Build ShimaStyle Tweak

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Tự động chạy khi bạn push một tag bắt đầu bằng "v" (ví dụ: v1.0.0)
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép kích hoạt build thủ công từ giao diện GitHub

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    name: Build .deb Package
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: brew install ldid xz

      - name: Setup Theos & iOS SDKs
        run: |
          # Tải Theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          # Tải iOS SDKs (giải nén trực tiếp để tiết kiệm thời gian)
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -x -z -C $THEOS/sdks --strip-components=1

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update Version in Control File
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            FILE="control"
            [ ! -f "control" ] && FILE="control.yaml"
            BASE_VERSION=$(awk '/^Version:/ {print $2}' $FILE | sed 's/-.*//')
            VERSION="${BASE_VERSION}-${{ steps.vars.outputs.sha_short }}"
          fi
          echo "Updating version to $VERSION"
          if [ -f "control" ]; then
            sed -i '' "s/^Version:.*/Version: $VERSION/" control
          elif [ -f "control.yaml" ]; then
            sed -i '' "s/^Version:.*/Version: $VERSION/" control.yaml
          fi

      - name: Build Tweak (Make Package)
        run: make package FINALPACKAGE=1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', steps.vars.outputs.sha_short) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Build {0}', steps.vars.outputs.sha_short) }}
          files: packages/*.deb
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}