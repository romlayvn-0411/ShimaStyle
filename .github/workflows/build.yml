name: Build ShimaStyle Tweak

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Tự động chạy khi bạn push một tag bắt đầu bằng "v" (ví dụ: v1.0.0)
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép kích hoạt build thủ công từ giao diện GitHub

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    name: Build .deb Package
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: brew install ldid xz

      - name: Setup Theos & iOS SDKs
        run: |
          # Tải Theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          # Tải iOS SDKs (giải nén trực tiếp để tiết kiệm thời gian)
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -x -z -C $THEOS/sdks --strip-components=1

      - name: Update Version in Control File
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Updating version to $VERSION"
          if [ -f "control" ]; then
            sed -i '' "s/^Version:.*/Version: $VERSION/" control
          elif [ -f "control.yaml" ]; then
            sed -i '' "s/^Version:.*/Version: $VERSION/" control.yaml
          fi

      - name: Build Tweak (Make Package)
        run: make package FINALPACKAGE=1

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShimaStyle-Package
          path: packages/*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}